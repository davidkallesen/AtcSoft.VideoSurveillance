        overlayPosition:
          $ref: "#/components/schemas/AppSettingsOverlayPosition"
        allowDragAndDropReorder:
          type: boolean
        autoSaveLayoutChanges:
          type: boolean
        snapshotPath:
          type: string
        # Connection
        defaultProtocol:
