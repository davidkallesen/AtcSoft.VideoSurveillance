        # Performance
        videoQuality:
          type: string
          description: "The highest resolution to decode at: Auto (the camera's own), 1080p, 720p, 480p or 360p. The older names low, medium, high and ultra are still accepted."
        hardwareAcceleration:
          type: boolean
        lowLatencyMode:
          type: boolean
        bufferDurationMs:
          type: integer
          format: int32
          minimum: 1
        rtspTransport:
          $ref: "#/components/schemas/AppSettingsRtspTransport"
        maxLatencyMs:
          type: integer
          format: int32
          minimum: 1
        # Motion Detection
        motionSensitivity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        minimumChangePercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        analysisFrameRate:
          type: integer
          format: int32
          minimum: 1
        analysisWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        analysisHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        postMotionDurationSeconds:
          type: integer
          format: int32
          minimum: 1
        cooldownSeconds:
          type: integer
          format: int32
          minimum: 1
        boundingBoxShowInGrid:
          type: boolean
        boundingBoxShowInFullScreen:
          type: boolean
        boundingBoxColor:
          type: string
        boundingBoxThickness:
          type: integer
          format: int32
          minimum: 1
        boundingBoxMinArea:
          type: integer
          format: int32
          minimum: 1
        boundingBoxPadding:
          type: integer
          format: int32
          minimum: 0
        boundingBoxSmoothing:
          type: number
          format: double
          minimum: 0
          maximum: 1
        # Recording
        recordingPath:
          type: string
        recordingFormat:
          $ref: "#/components/schemas/AppSettingsRecordingFormat"
        recordAsH264:
          type: boolean
          description: Record every camera as H.264 whatever it sends. A camera that sends anything else (H.265, MJPEG) is then decoded and encoded again while it is recorded, which costs processor time. Takes effect the next time a camera is opened.
        enableRecordingOnMotion:
          type: boolean
        enableRecordingOnConnect:
          type: boolean
        enableHourlySegmentation:
          type: boolean
        maxRecordingDurationMinutes:
          type: integer
          format: int32
          minimum: 1
        thumbnailTileCount:
          type: integer
          format: int32
          minimum: 1
        useDailySubfolders:
          type: boolean
          description: Put each day's recordings in their own yyyy-MM-dd folder below the camera folder. On by default. Changing it moves the existing recordings.
        separateThumbnailFolder:
          type: boolean
          description: Keep thumbnails in a thumbnails folder below the recording path instead of next to the videos. On by default. Changing it moves the existing thumbnails.
        enableTimelapse:
          type: boolean
        timelapseInterval:
          type: string
        cleanupSchedule:
          $ref: "#/components/schemas/AppSettingsCleanupSchedule"
        recordingRetentionDays:
          type: integer
          format: int32
          minimum: 1
        cleanupIncludeSnapshots:
          type: boolean
        snapshotRetentionDays:
          type: integer
          format: int32
          minimum: 1
        enableDiskSpaceGuard:
          type: boolean
          description: Delete the oldest recordings when free disk space drops below minFreeSpaceMb.
        minFreeSpaceMb:
          type: integer
          format: int32
          description: Free disk space, in megabytes, the disk space guard keeps available.
        playbackShowFilename:
          type: boolean
        playbackFilenameColor:
          type: string
        playbackShowTimestamp:
          type: boolean
        playbackTimestampColor:
          type: string
        # Advanced
        enableDebugLogging:
          type: boolean
        logPath:
          type: string

    AppSettingsThemeBase:
      type: string
      enum: [dark, light]

    AppSettingsConnectionTypeIconPlacement:
      type: string
      enum: [sameRow, sameColumn]

    AppSettingsOverlayPosition:
      type: string
      enum: [topLeft, topRight, bottomLeft, bottomRight]

    AppSettingsDefaultProtocol:
      type: string
      enum: [rtsp, http, https]

    AppSettingsRtspTransport:
      type: string
      enum: [tcp, udp]

    AppSettingsRecordingFormat:
      type: string
      enum: [mp4, mkv, avi]

    AppSettingsCleanupSchedule:
      type: string
      enum: [disabled, onStartup, onStartupAndPeriodically]

    ProblemDetails:
      title: ProblemDetails
      type: object
      description: An RFC 9457 problem, as every error response is written.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

    Webhook:
      title: Webhook
      type: object
      required:
        - id
        - url
        - events
        - hasSecret
        - isEditable
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The http or https address events are posted to.
        events:
          type: array
          description: The events the receiver gets, by name ("motion.started") or by group ("motion.*"). Empty means all events.
          items:
            type: string
        hasSecret:
          type: boolean
          description: Whether requests to the receiver are signed. The secret itself is never sent out.
        isEditable:
          type: boolean
          description: False for a receiver that comes from the server's configuration.

    CreateWebhookRequest:
      title: CreateWebhookRequest
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
        secret:
          type: string
          description: Signs each request (X-AtcSoft-Signature). Leave out for unsigned requests.
        events:
          type: array
          items:
            type: string

    UpdateWebhookRequest:
      title: UpdateWebhookRequest
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
        secret:
          type: string
          description: Leave out to keep the secret as it is; send an empty text to remove it.
        events:
          type: array
          items:
            type: string

    WebhookTestResult:
      title: WebhookTestResult
      type: object
      required:
        - delivered
      properties:
        delivered:
          type: boolean
          description: Whether the receiver answered the test event with a success status.

    StorageStatus:
      title: StorageStatus
      type: object
      required:
        - freeBytes
        - totalBytes
        - minFreeBytes
        - isLow
        - usedPercent
        - text
      properties:
        freeBytes:
          type: integer
          format: int64
          description: The space left on the disk.
        totalBytes:
          type: integer
          format: int64
          description: The size of the disk.
        minFreeBytes:
          type: integer
          format: int64
          description: The space the disk-space guard keeps free; zero when the guard is off.
        isLow:
          type: boolean
          description: Whether less is left than the guard keeps free. New recordings are then refused.
        usedPercent:
          type: integer
          format: int32
        text:
          type: string
          description: The status in words, for a status bar ("120 GB free of 500 GB").

    CameraConnectionState:
      type: string
      description: How the server's connection to a camera is.
      enum: [disconnected, connecting, connected, reconnecting, error, deviceUnplugged]

    RecordingStatusState:
      type: string
      description: Whether a camera is being recorded, and why.
      enum: [idle, recording, recordingMotion, recordingPostMotion]

    UsbCameraLifecyclePhase:
      type: string
      description: A USB camera on the server was unplugged, or plugged in again.
      enum: [unplugged, replugged]

    ConnectionStateChangedEvent:
      title: ConnectionStateChangedEvent
      type: object
      description: Event (GET /events) - the server's connection to a camera changed.
      required:
        - cameraId
        - newState
        - timestamp
      properties:
        cameraId:
          type: string
          format: uuid
        newState:
          $ref: "#/components/schemas/CameraConnectionState"
        timestamp:
          type: string
          format: date-time

    RecordingStateChangedEvent:
      title: RecordingStateChangedEvent
      type: object
      description: Event (GET /events) - a camera started or stopped being recorded.
      required:
        - cameraId
        - newState
        - oldState
        - timestamp
      properties:
        cameraId:
          type: string
          format: uuid
        newState:
          $ref: "#/components/schemas/RecordingStatusState"
        oldState:
          $ref: "#/components/schemas/RecordingStatusState"
        filePath:
          type: string
          description: The file being written, or the file just finished.
        timestamp:
          type: string
          format: date-time

    MotionBox:
      title: MotionBox
      type: object
      description: Where something moved, in the coordinates of the analysed picture.
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double

    MotionDetectedEvent:
      title: MotionDetectedEvent
      type: object
      description: Event (GET /events) - motion on a camera started, goes on, or ended.
      required:
        - cameraId
        - isMotionActive
        - changePercentage
        - boundingBoxes
        - analysisWidth
        - analysisHeight
        - timestamp
      properties:
        cameraId:
          type: string
          format: uuid
        isMotionActive:
          type: boolean
        changePercentage:
          type: number
          format: double
        boundingBoxes:
          type: array
          items:
            $ref: "#/components/schemas/MotionBox"
        analysisWidth:
          type: integer
          format: int32
          description: The width of the analysed picture, which the boxes are in.
        analysisHeight:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time

    UsbCameraLifecycleEvent:
      title: UsbCameraLifecycleEvent
      type: object
      description: Event (GET /events) - a USB camera on the server was unplugged or plugged in again.
      required:
        - cameraId
        - phase
        - deviceId
        - friendlyName
        - timestamp
      properties:
        cameraId:
          type: string
          format: uuid
        phase:
          $ref: "#/components/schemas/UsbCameraLifecyclePhase"
        deviceId:
          type: string
        friendlyName:
          type: string
        timestamp:
          type: string
          format: date-time

    WebhookPayload:
      title: WebhookPayload
      type: object
      description: >-
        What the server posts to a webhook receiver. Not an operation of this API - the server sends it - so it is
        declared here only to document the body and generate its type. Headers - X-AtcSoft-Event (the event),
        X-AtcSoft-Delivery (the same for every attempt) and X-AtcSoft-Signature (sha256= and the HMAC-SHA256 of the
        body, when the receiver has a secret).
      required:
        - event
        - cameraId
        - cameraName
        - timestamp
        - data
      properties:
        event:
          type: string
          description: camera.connected, camera.disconnected, recording.started, recording.stopped, motion.started, motion.stopped, or webhook.test.
        cameraId:
          type: string
          format: uuid
        cameraName:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/WebhookPayloadData"

    WebhookPayloadData:
      title: WebhookPayloadData
      type: object
      description: What else is known about the event. A field the event has no value for is left out.
      properties:
        filePath:
          type: string
          description: recording.* - the recording, below the recording folder, with forward slashes.
        state:
          type: string
          description: camera.* - the camera's state as the server names it (Connected, Disconnected, Error).
        changePercentage:
          type: number
          format: double
          description: motion.* - how much of the picture changed.
        message:
          type: string
          description: webhook.test - what the test is.

    SurveillanceEvent:
      title: SurveillanceEvent
      type: object
      description: >-
        One event of GET /events. type names the part that is filled; a type this
        client does not know yet can be read past.
      required:
        - type
        - cameraId
        - timestamp
      properties:
        type:
          type: string
          description: connectionStateChanged, recordingStateChanged, motionDetected or usbCameraLifecycleChanged.
        cameraId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        connection:
          $ref: "#/components/schemas/ConnectionStateChangedEvent"
        recording:
          $ref: "#/components/schemas/RecordingStateChangedEvent"
        motion:
          $ref: "#/components/schemas/MotionDetectedEvent"
        usb:
          $ref: "#/components/schemas/UsbCameraLifecycleEvent"
