openapi: "3.2.0"
info:
  version: 1.0.0
  title: AtcSoft Video Surveillance API
  description: REST API for headless video surveillance — camera management, recording, and live streaming.
  license:
    name: MIT

paths:
  /cameras:
    get:
      summary: List all cameras
      operationId: listCameras
      tags:
        - cameras
      responses:
        '200':
          description: A list of cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
    post:
      summary: Add a new camera
      operationId: createCamera
      tags:
        - cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCameraRequest"
      responses:
        '201':
          description: Camera created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cameras/{cameraId}:
    get:
      summary: Get camera by ID
      operationId: getCameraById
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Camera details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a camera
      operationId: updateCamera
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCameraRequest"
      responses:
        '200':
          description: Camera updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a camera
      operationId: deleteCamera
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Camera deleted
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cameras/{cameraId}/snapshot:
    get:
      summary: Capture a snapshot from a camera
      operationId: captureSnapshot
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '503':
          description: Camera not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cameras/{cameraId}/detect-connection-type:
    post:
      summary: Detect the camera's connection type (wired or Wi-Fi) via ONVIF
      description: >-
        Probes the camera with its stored credentials and returns the detected
        connection type without saving it. The client decides whether to apply
        it. Returns none when the camera does not support ONVIF, rejects the
        credentials, or reports an unknown interface type.
      operationId: detectConnectionType
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTypeDetection"
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cameras/{cameraId}/recording:
    post:
      summary: Start recording a camera
      operationId: startRecording
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '409':
          description: Already recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Stop recording a camera
      operationId: stopRecording
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/usb:
    get:
      summary: List USB cameras visible to the server host
      operationId: listUsbDevices
      tags:
        - devices
      responses:
        '200':
          description: A list of USB camera descriptors currently enumerable on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsbDeviceDescriptor"
        '503':
          description: USB enumeration is not supported on this host (e.g. headless Linux without v4l2 yet).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /layouts:
    get:
      summary: List all layouts
      operationId: listLayouts
      tags:
        - layouts
      responses:
        '200':
          description: A list of layouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layout"
    post:
      summary: Create a new layout
      operationId: createLayout
      tags:
        - layouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLayoutRequest"
      responses:
        '201':
          description: Layout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /layouts/{layoutId}:
    put:
      summary: Update a layout
      operationId: updateLayout
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLayoutRequest"
      responses:
        '200':
          description: Layout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Layout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a layout
      operationId: deleteLayout
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Layout deleted
        '404':
          description: Layout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /layouts/{layoutId}/apply:
    post:
      summary: Apply a layout as the active layout
      operationId: applyLayout
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Layout applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '404':
          description: Layout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /recordings:
    get:
      summary: List recordings
      operationId: listRecordings
      tags:
        - recordings
      parameters:
        - name: cameraId
          in: query
          required: false
          description: Filter by camera ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /settings:
    get:
      summary: Get application settings
      operationId: getSettings
      tags:
        - settings
      responses:
        '200':
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      summary: Update application settings
      operationId: updateSettings
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        '400':
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Camera:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
          default: network
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
        protocol:
          type: string
          enum: [rtsp, http, https]
        path:
          type: string
        username:
          type: string
        # USB-camera fields — populated only when source = usb
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
        usbHeight:
          type: integer
          format: int32
        usbFrameRate:
          type: number
          format: double
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32
        connectionState:
          type: string
          enum: [disconnected, connecting, connected, reconnecting, error, deviceUnplugged]
        isRecording:
          type: boolean

    ConnectionTypeDetection:
      type: object
      required:
        - connectionType
      properties:
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
    UsbDeviceDescriptor:
      type: object
      required:
        - deviceId
        - friendlyName
      properties:
        deviceId:
          type: string
          description: Stable Media Foundation symbolic link.
        friendlyName:
          type: string
        vendorId:
          type: string
          description: Hex 4-digit USB vendor id.
        productId:
          type: string
          description: Hex 4-digit USB product id.
        isPresent:
          type: boolean
        capabilities:
          type: array
          description: Capture-format triples the device advertises (resolution × frame-rate × pixel-format).
          items:
            $ref: "#/components/schemas/UsbStreamFormat"

    UsbStreamFormat:
      type: object
      required:
        - width
        - height
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        frameRate:
          type: number
          format: double
        pixelFormat:
          type: string
          description: FFmpeg pixel-format string (nv12 / yuyv422 / mjpeg / h264 / etc).

    CreateCameraRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
          default: network
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
          default: 554
        protocol:
          type: string
          enum: [rtsp, http, https]
          default: rtsp
        path:
          type: string
        username:
          type: string
        password:
          type: string
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
        usbHeight:
          type: integer
          format: int32
        usbFrameRate:
          type: number
          format: double
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32

    UpdateCameraRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
        protocol:
          type: string
          enum: [rtsp, http, https]
        path:
          type: string
        username:
          type: string
        password:
          type: string
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
        usbHeight:
          type: integer
          format: int32
        usbFrameRate:
          type: number
          format: double
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32

    RecordingStatus:
      type: object
      required:
        - cameraId
        - state
      properties:
        cameraId:
          type: string
          format: uuid
        state:
          type: string
          enum: [idle, recording, recordingMotion, recordingPostMotion]
        filePath:
          type: string
        startedAt:
          type: string
          format: date-time

    Layout:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rows:
          type: integer
          format: int32
        columns:
          type: integer
          format: int32
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"

    LayoutItem:
      type: object
      properties:
        cameraId:
          type: string
          format: uuid
        position:
          type: integer
          format: int32

    CreateLayoutRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        rows:
          type: integer
          format: int32
          default: 2
        columns:
          type: integer
          format: int32
          default: 2

    UpdateLayoutRequest:
      type: object
      properties:
        name:
          type: string
        rows:
          type: integer
          format: int32
        columns:
          type: integer
          format: int32
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"

    Recording:
      type: object
      required:
        - id
        - cameraId
        - filePath
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        cameraId:
          type: string
          format: uuid
        cameraName:
          type: string
        filePath:
          type: string
        startedAt:
          type: string
          format: date-time
        duration:
          type: string
          description: ISO 8601 duration
        fileSizeBytes:
          type: integer
          format: int64
        hasThumbnail:
          type: boolean

    AppSettings:
      type: object
      properties:
        # General
        themeBase:
          type: string
          enum: [dark, light]
        themeAccent:
          type: string
        language:
          type: string
        connectOnStartup:
          type: boolean
        startMaximized:
          type: boolean
        # Camera Display
        showOverlayTitle:
          type: boolean
        showOverlayDescription:
          type: boolean
        showOverlayTime:
          type: boolean
        showOverlayConnectionStatus:
          type: boolean
        showOverlayConnectionTypeIcon:
          type: boolean
          description: Show the connection-type icon (LAN / Wi-Fi / USB) in a free tile corner.
        connectionTypeIconPlacement:
          type: string
          enum: [sameRow, sameColumn]
          description: Which corner adjacent to the overlay info box holds the connection-type icon.
        overlayOpacity:
          type: number
          format: double
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        allowDragAndDropReorder:
          type: boolean
        autoSaveLayoutChanges:
          type: boolean
        snapshotPath:
          type: string
        # Connection
        defaultProtocol:
          type: string
          enum: [rtsp, http, https]
        defaultPort:
          type: integer
          format: int32
        connectionTimeoutSeconds:
          type: integer
          format: int32
        reconnectDelaySeconds:
          type: integer
          format: int32
        autoReconnectOnFailure:
          type: boolean
        showNotificationOnDisconnect:
          type: boolean
        showNotificationOnReconnect:
          type: boolean
        playNotificationSound:
          type: boolean
        # Performance
        videoQuality:
          type: string
          enum: [auto, low, medium, high, ultra]
        hardwareAcceleration:
          type: boolean
        lowLatencyMode:
          type: boolean
        bufferDurationMs:
          type: integer
          format: int32
        rtspTransport:
          type: string
          enum: [tcp, udp]
        maxLatencyMs:
          type: integer
          format: int32
        # Motion Detection
        motionSensitivity:
          type: integer
          format: int32
        minimumChangePercent:
          type: number
          format: double
        analysisFrameRate:
          type: integer
          format: int32
        analysisWidth:
          type: integer
          format: int32
        analysisHeight:
          type: integer
          format: int32
        postMotionDurationSeconds:
          type: integer
          format: int32
        cooldownSeconds:
          type: integer
          format: int32
        boundingBoxShowInGrid:
          type: boolean
        boundingBoxShowInFullScreen:
          type: boolean
        boundingBoxColor:
          type: string
        boundingBoxThickness:
          type: integer
          format: int32
        boundingBoxMinArea:
          type: integer
          format: int32
        boundingBoxPadding:
          type: integer
          format: int32
        boundingBoxSmoothing:
          type: number
          format: double
        # Recording
        recordingPath:
          type: string
        recordingFormat:
          type: string
          enum: [mp4, mkv, avi]
        enableRecordingOnMotion:
          type: boolean
        enableRecordingOnConnect:
          type: boolean
        enableHourlySegmentation:
          type: boolean
        maxRecordingDurationMinutes:
          type: integer
          format: int32
        thumbnailTileCount:
          type: integer
          format: int32
        useDailySubfolders:
          type: boolean
          description: Put each day's recordings in their own yyyy-MM-dd folder below the camera folder.
        separateThumbnailFolder:
          type: boolean
          description: Keep thumbnails in a thumbnails folder below the recording path instead of next to the videos.
        enableTimelapse:
          type: boolean
        timelapseInterval:
          type: string
        cleanupSchedule:
          type: string
          enum: [disabled, onStartup, onStartupAndPeriodically]
        recordingRetentionDays:
          type: integer
          format: int32
        cleanupIncludeSnapshots:
          type: boolean
        snapshotRetentionDays:
          type: integer
          format: int32
        enableDiskSpaceGuard:
          type: boolean
          nullable: true
          description: Delete the oldest recordings when free disk space drops below minFreeSpaceMb. Omit to leave the current value unchanged.
        minFreeSpaceMb:
          type: integer
          format: int32
          description: Free disk space, in megabytes, the disk space guard keeps available. 0 or omitted leaves the current value unchanged.
        playbackShowFilename:
          type: boolean
        playbackFilenameColor:
          type: string
        playbackShowTimestamp:
          type: boolean
        playbackTimestampColor:
          type: string
        # Advanced
        enableDebugLogging:
          type: boolean
        logPath:
          type: string

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
