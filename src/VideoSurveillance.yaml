openapi: "3.2.0"
info:
  version: 1.0.0
  title: AtcSoft Video Surveillance API
  description: REST API for headless video surveillance — camera management, recording, and live streaming.
  license:
    name: MIT

paths:
  /auth/setup:
    get:
      summary: Whether the server still needs its first admin
      operationId: getSetupStatus
      security: []
      tags:
        - auth
      responses:
        '200':
          description: The setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      summary: Create the first admin
      description: >-
        Only while the server has no user. The setup code is in the file setup-code.txt in the server's data folder,
        so only someone who can read the server's disk can create the first admin.
      operationId: completeSetup
      security: []
      x-retry-enabled: false
      # Guessing passwords or the setup code: ten tries a minute from one address.
      x-ratelimit-policy: sign-in
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSetupRequest"
      responses:
        '200':
          description: The first admin is created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The setup code is not right
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The server has users already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/token:
    post:
      summary: Sign in
      operationId: createSession
      security: []
      x-retry-enabled: false
      # Guessing passwords or the setup code: ten tries a minute from one address.
      x-ratelimit-policy: sign-in
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The user name or the password is not right (which of them is not said)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/refresh:
    post:
      summary: Renew a session
      description: Gives a new access token and a new refresh token for a refresh token, which can then not be used again.
      operationId: refreshSession
      security: []
      x-retry-enabled: false
      # Guessing passwords or the setup code: ten tries a minute from one address.
      x-ratelimit-policy: sign-in
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        '200':
          description: The session is renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        '400':
          description: The refresh token is not known, or has run out; sign in again
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many tries from this address; Retry-After says when to try again.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/sign-out:
    post:
      summary: Sign out
      description: Ends the session the refresh token belongs to. One that is already gone is no error.
      operationId: endSession
      security: []
      x-retry-enabled: false
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        '204':
          description: Signed out

  /auth/me:
    get:
      summary: The signed-in user
      operationId: getCurrentUser
      security:
        - bearer: []
      tags:
        - auth
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras:
    get:
      summary: List all cameras
      operationId: listCameras
      tags:
        - cameras
      responses:
        '200':
          description: A list of cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
    post:
      summary: Add a new camera
      operationId: createCamera
      tags:
        - cameras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCameraRequest"
      responses:
        '201':
          description: Camera created
          headers:
            Location:
              description: The new resource's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}:
    get:
      summary: Get camera by ID
      operationId: getCameraById
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Camera details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    put:
      summary: Update a camera
      operationId: updateCamera
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCameraRequest"
      responses:
        '200':
          description: Camera updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Delete a camera
      operationId: deleteCamera
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Camera deleted
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/snapshot:
    get:
      summary: Capture a snapshot from a camera
      operationId: captureSnapshot
      # A GET named capture: it also saves the picture, which "capture" says.
      x-atc-suppress: ATC_API_OPR003
      # A snapshot opens the camera's stream; a client in a loop would keep the
      # server opening streams. Twenty per ten seconds is more than a person clicks.
      x-ratelimit-policy: snapshots
      x-ratelimit-permit-limit: 20
      x-ratelimit-window-seconds: 10
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many calls from this client; Retry-After says when to call again.
          headers:
            Retry-After:
              description: Seconds to wait before calling again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '503':
          description: Camera not connected
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/detect-connection-type:
    post:
      summary: Detect the camera's connection type (wired or Wi-Fi) via ONVIF
      description: >-
        Probes the camera with its stored credentials and returns the detected
        connection type without saving it. The client decides whether to apply
        it. Returns none when the camera does not support ONVIF, rejects the
        credentials, or reports an unknown interface type.
      operationId: detectConnectionType
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTypeDetection"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/recording:
    post:
      summary: Start recording a camera
      operationId: startRecording
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: Already recording
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Stop recording a camera
      operationId: stopRecording
      # A DELETE named stop: it stops a recording; deleteRecording deletes a file.
      x-atc-suppress: ATC_API_OPR007
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/stream:
    post:
      summary: Start watching a camera live
      description: >-
        Takes a lease on the camera's HLS stream and answers when the stream can be played (up to a minute for a
        camera that is slow to deliver its first segment). The viewer renews the lease every renewSeconds and gives
        it back when it stops watching; a lease that is not renewed ends by itself, and the stream stops when the
        last lease on it is gone.
      operationId: startStream
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stream can be played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamLease"
        '404':
          description: Camera not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '503':
          description: The stream could not be started (the camera cannot be opened, or gave no picture in time)
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /cameras/{cameraId}/stream/{leaseId}:
    put:
      summary: Renew a stream lease
      description: A viewer still watching renews its lease; a lease the server does not have (it ended, or the server restarted) is not found, and the viewer starts the stream again.
      operationId: renewStreamLease
      # A PUT named renew: it changes nothing in the lease but how long it lasts.
      x-atc-suppress: ATC_API_OPR005
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Renewed
        '404':
          description: Lease not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Give a stream lease back
      description: The viewer stopped watching. A lease that is already gone is given back all the same.
      operationId: deleteStreamLease
      x-retry-enabled: false
      tags:
        - cameras
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Given back

  /devices/usb:
    get:
      summary: List USB cameras visible to the server host
      operationId: listUsbDevices
      # Enumerating the devices takes a moment; the list is kept 5 seconds, and
      # the server drops it as soon as a USB camera is plugged in or pulled out.
      x-cache-type: output
      x-cache-policy: usb-devices
      x-cache-expiration-seconds: 5
      x-cache-tags:
        - usb-devices
      tags:
        - devices
      responses:
        '200':
          description: A list of USB camera descriptors currently enumerable on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsbDeviceDescriptor"
        '503':
          description: USB enumeration is not supported on this host (e.g. headless Linux without v4l2 yet).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /layouts:
    get:
      summary: List all layouts
      operationId: listLayouts
      tags:
        - layouts
      responses:
        '200':
          description: A list of layouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layout"
    post:
      summary: Create a new layout
      operationId: createLayout
      tags:
        - layouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLayoutRequest"
      responses:
        '201':
          description: Layout created
          headers:
            Location:
              description: The new resource's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /layouts/{layoutId}:
    put:
      summary: Update a layout
      operationId: updateLayout
      x-retry-enabled: false
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLayoutRequest"
      responses:
        '200':
          description: Layout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Layout not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Delete a layout
      operationId: deleteLayout
      x-retry-enabled: false
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Layout deleted
        '404':
          description: Layout not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /layouts/{layoutId}/apply:
    post:
      summary: Apply a layout as the active layout
      operationId: applyLayout
      tags:
        - layouts
      parameters:
        - name: layoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Layout applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        '404':
          description: Layout not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /recordings:
    get:
      summary: List recordings
      operationId: listRecordings
      tags:
        - recordings
      parameters:
        - name: cameraId
          in: query
          required: false
          description: Filter by camera ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"
    delete:
      summary: Delete a recording
      description: Deletes one finished recording together with its thumbnail. A recording that is still being made cannot be deleted.
      operationId: deleteRecording
      x-retry-enabled: false
      tags:
        - recordings
      parameters:
        - name: filePath
          in: query
          required: true
          description: The recording's path relative to the recordings root, as the listing returns it in filePath.
          schema:
            type: string
      responses:
        '204':
          description: Recording deleted
        '400':
          description: The path does not name a recording
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Recording not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The recording is still being made
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /events:
    # No retry: a live stream is not sent again from the start; the client resumes with Last-Event-ID.
    x-retry-enabled: false
    get:
      summary: The camera events as they happen, as Server-Sent Events
      operationId: listEvents
      tags:
        - events
      description: |
        One stream of what the hub sends to every client: connection, recording, motion and USB events, each with
        an id. A client that sends the last id it read as Last-Event-ID gets the events after it from a buffer of the
        latest ones (X-Events-Missed says how many the buffer no longer had), then the live ones. When nothing
        happens for heartbeatSeconds, a named event "ping" - which the generated clients read past - keeps a proxy
        from closing the idle connection. A reader that falls behind is cut off, and resumes.
      parameters:
        - name: cameraId
          in: query
          required: false
          description: Only the events of this camera.
          schema:
            type: string
            format: uuid
        - name: heartbeatSeconds
          in: query
          required: false
          description: Seconds without an event before a ping event (15 when left out).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event read; the stream goes on after it.
          schema:
            type: string
      responses:
        '200':
          description: The events, one at a time.
          headers:
            X-Events-Missed:
              description: How many events after Last-Event-ID the buffer no longer had (0 when it had them all; at least 1 for an id of an earlier run of the server, whose events since are not known).
              schema:
                type: integer
                format: int64
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/SurveillanceEvent"

  /settings:
    get:
      summary: Get application settings
      operationId: getSettings
      tags:
        - settings
      responses:
        '200':
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      summary: Update application settings
      operationId: updateSettings
      x-retry-enabled: false
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        '400':
          description: Invalid settings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /settings/storage:
    get:
      summary: Get how full the disk with the recordings is
      operationId: getStorageStatus
      tags:
        - settings
      responses:
        '200':
          description: The space on the disk the recording folder is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        '503':
          description: The disk of the recording folder cannot be read (a share that is offline, a drive that is gone).
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /webhooks:
    get:
      summary: List the receivers the server posts its events to
      operationId: listWebhooks
      tags:
        - webhooks
      responses:
        '200':
          description: The receivers, those from the server's configuration first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      summary: Add a receiver
      operationId: createWebhook
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        '201':
          description: Receiver added
          headers:
            Location:
              description: The new resource's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        '400':
          description: The address is not an http or https address
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /webhooks/{webhookId}:
    put:
      summary: Change a receiver
      operationId: updateWebhook
      x-retry-enabled: false
      tags:
        - webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        '200':
          description: Receiver changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        '400':
          description: The address is not an http or https address
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Receiver not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The receiver comes from the server's configuration and cannot be changed here
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Remove a receiver
      operationId: deleteWebhook
      x-retry-enabled: false
      tags:
        - webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Receiver removed
        '404':
          description: Receiver not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: The receiver comes from the server's configuration and cannot be removed here
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /webhooks/{webhookId}/test:
    post:
      summary: Send a test event to a receiver
      operationId: testWebhook
      # A test sends a request to someone else's server.
      x-ratelimit-policy: webhook-tests
      x-ratelimit-permit-limit: 10
      x-ratelimit-window-seconds: 60
      x-ratelimit-algorithm: fixed
      x-ratelimit-partition: ip
      tags:
        - webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The test event was sent; the result says whether the receiver took it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        '404':
          description: Receiver not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: Too many calls from this client; Retry-After says when to call again.
          headers:
            Retry-After:
              description: Seconds to wait before calling again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

# The clients' resilience. Some calls are slow by nature (starting a recording
# waits for the camera, saving a changed folder layout moves the recordings), so
# an attempt has two minutes and all of them together five; the breaker samples at
# least twice an attempt. Only reads are repeated: POST and PATCH never are, and
# every PUT and DELETE says so below.
x-retry-policy: standard
x-retry-max-attempts: 3
x-retry-delay-seconds: 2
x-retry-backoff: exponential
x-retry-use-jitter: true
x-retry-timeout-seconds: 120
x-retry-total-timeout-seconds: 300
x-retry-circuit-breaker: true
x-retry-cb-sampling-duration-seconds: 240
x-retry-handle-429: true

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from createSession, completeSetup or refreshSession.

  schemas:
    UserRole:
      type: string
      description: >-
        viewer watches and reads; operator also records, takes snapshots and edits cameras and layouts; admin also
        changes the settings, the webhooks, the users and the API keys.
      enum: [viewer, operator, admin]

    SetupStatus:
      title: SetupStatus
      type: object
      required:
        - setupRequired
      properties:
        setupRequired:
          type: boolean
          description: True while the server has no user; completeSetup creates the first admin.

    CompleteSetupRequest:
      title: CompleteSetupRequest
      type: object
      required:
        - setupCode
        - userName
        - password
      properties:
        setupCode:
          type: string
          minLength: 1
          description: The code in setup-code.txt in the server's data folder.
        userName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256

    SignInRequest:
      title: SignInRequest
      type: object
      required:
        - userName
        - password
      properties:
        userName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256

    RefreshSessionRequest:
      title: RefreshSessionRequest
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    Session:
      title: Session
      type: object
      description: >-
        A signed-in session. The access token is sent as "Authorization: Bearer <token>" until it runs out, then
        refreshSession gives a new one for the refresh token.
      required:
        - accessToken
        - expiresInSeconds
        - refreshToken
        - userName
        - role
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
          description: How long the access token is valid.
        refreshToken:
          type: string
          description: Renews the session (refreshSession) or ends it (endSession). It is valid for 30 days after its last use.
        userName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    CurrentUser:
      title: CurrentUser
      type: object
      required:
        - userName
        - role
      properties:
        userName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    Camera:
      title: Camera
      type: object
      required:
        - id
        - displayName
        - description
        - source
        - connectionType
        - rotation
        - ipAddress
        - port
        - protocol
        - path
        - username
        - overlayPosition
        - streamUseLowLatencyMode
        - streamMaxLatencyMs
        - streamRtspTransport
        - streamBufferDurationMs
        - isRecording
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
          default: network
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
        protocol:
          type: string
          enum: [rtsp, http, https]
        path:
          type: string
        username:
          type: string
        # USB-camera fields — populated only when source = usb
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
        usbHeight:
          type: integer
          format: int32
        usbFrameRate:
          type: number
          format: double
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32
        connectionState:
          $ref: "#/components/schemas/CameraConnectionState"
        isRecording:
          type: boolean

    ConnectionTypeDetection:
      title: ConnectionTypeDetection
      type: object
      required:
        - connectionType
      properties:
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
    UsbDeviceDescriptor:
      title: UsbDeviceDescriptor
      type: object
      required:
        - deviceId
        - friendlyName
        - isPresent
        - capabilities
      properties:
        deviceId:
          type: string
          description: Stable Media Foundation symbolic link.
        friendlyName:
          type: string
        vendorId:
          type: string
          description: Hex 4-digit USB vendor id.
        productId:
          type: string
          description: Hex 4-digit USB product id.
        isPresent:
          type: boolean
        capabilities:
          type: array
          description: Capture-format triples the device advertises (resolution × frame-rate × pixel-format).
          items:
            $ref: "#/components/schemas/UsbStreamFormat"

    UsbStreamFormat:
      title: UsbStreamFormat
      type: object
      required:
        - width
        - height
        - frameRate
        - pixelFormat
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        frameRate:
          type: number
          format: double
        pixelFormat:
          type: string
          description: FFmpeg pixel-format string (nv12 / yuyv422 / mjpeg / h264 / etc).

    CreateCameraRequest:
      title: CreateCameraRequest
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
          default: network
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
          default: 554
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [rtsp, http, https]
          default: rtsp
        path:
          type: string
        username:
          type: string
        password:
          type: string
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        usbHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        usbFrameRate:
          type: number
          format: double
          minimum: 0.1
          maximum: 1000
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32

    UpdateCameraRequest:
      title: UpdateCameraRequest
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
        source:
          type: string
          enum: [network, usb]
        connectionType:
          type: string
          enum: [none, lan, wifi, usb]
          description: Physical link to the camera, shown as the connection-type icon. USB cameras are always usb; network cameras use none, lan or wifi.
        rotation:
          type: string
          enum: [none, rotate90, rotate180, rotate270]
          description: Clockwise rotation applied to the picture. Recordings carry it as a rotation flag.
        ipAddress:
          type: string
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [rtsp, http, https]
        path:
          type: string
        username:
          type: string
        password:
          type: string
        usbDeviceId:
          type: string
        usbFriendlyName:
          type: string
        usbWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        usbHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        usbFrameRate:
          type: number
          format: double
          minimum: 0.1
          maximum: 1000
        usbPixelFormat:
          type: string
        usbCaptureAudio:
          type: boolean
        usbAudioDeviceName:
          type: string
          description: DirectShow friendly name of the companion audio capture device (e.g. "Microphone (Logitech BRIO)"). Only consulted when usbCaptureAudio is true.
        overlayPosition:
          type: string
          enum: [topLeft, topRight, bottomLeft, bottomRight]
        streamUseLowLatencyMode:
          type: boolean
        streamMaxLatencyMs:
          type: integer
          format: int32
        streamRtspTransport:
          type: string
          enum: [tcp, udp]
        streamBufferDurationMs:
          type: integer
          format: int32

    StreamLease:
      title: StreamLease
      type: object
      description: A viewer's lease on a camera's live stream.
      required:
        - leaseId
        - cameraId
        - playlistUrl
        - renewSeconds
      properties:
        leaseId:
          type: string
          format: uuid
        cameraId:
          type: string
          format: uuid
        playlistUrl:
          type: string
          description: The HLS playlist, relative to the server (/streams/...).
        renewSeconds:
          type: integer
          format: int32
          description: How often the viewer renews the lease; one that is not renewed for twice as long ends.

    RecordingStatus:
      title: RecordingStatus
      type: object
      required:
        - cameraId
        - state
      properties:
        cameraId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/RecordingStatusState"
        filePath:
          type: string
        startedAt:
          type: string
          format: date-time

    Layout:
      title: Layout
      type: object
      required:
        - id
        - name
        - rows
        - columns
        - cameras
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rows:
          type: integer
          format: int32
        columns:
          type: integer
          format: int32
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"

    LayoutItem:
      title: LayoutItem
      type: object
      properties:
        cameraId:
          type: string
          format: uuid
        position:
          type: integer
          format: int32

    CreateLayoutRequest:
      title: CreateLayoutRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        rows:
          type: integer
          format: int32
          default: 2
          minimum: 1
        columns:
          type: integer
          format: int32
          default: 2
          minimum: 1

    UpdateLayoutRequest:
      title: UpdateLayoutRequest
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        rows:
          type: integer
          format: int32
          minimum: 1
        columns:
          type: integer
          format: int32
          minimum: 1
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"

    Recording:
      title: Recording
      type: object
      required:
        - id
        - cameraId
        - cameraName
        - filePath
        - startedAt
        - duration
        - fileSizeBytes
        - hasThumbnail
        - inProgress
      properties:
        id:
          type: string
          format: uuid
        cameraId:
          type: string
          format: uuid
        cameraName:
          type: string
        filePath:
          type: string
        startedAt:
          type: string
          format: date-time
        duration:
          type: string
          description: ISO 8601 duration
        fileSizeBytes:
          type: integer
          format: int64
        hasThumbnail:
          type: boolean
        inProgress:
          type: boolean
          description: True while the recording is still being made. Its size and duration are not final, and it may not play until it is finished.
        thumbnailPath:
          type: string
          description: Path of the thumbnail relative to the recordings root, with forward slashes; fetch it from /recordings-files/{thumbnailPath}. Null when the recording has no thumbnail.

    AppSettings:
      title: AppSettings
      type: object
      description: The settings as the server has them. Every setting is always there.
      required:
        - themeBase
        - themeAccent
        - language
        - connectOnStartup
        - startMaximized
        - showOverlayTitle
        - showOverlayDescription
        - showOverlayTime
        - showOverlayConnectionStatus
        - showOverlayQuickActions
        - showOverlayConnectionTypeIcon
        - connectionTypeIconPlacement
        - overlayOpacity
        - overlayPosition
        - allowDragAndDropReorder
        - autoSaveLayoutChanges
        - snapshotPath
        - defaultProtocol
        - defaultPort
        - connectionTimeoutSeconds
        - reconnectDelaySeconds
        - autoReconnectOnFailure
        - showNotificationOnDisconnect
        - showNotificationOnReconnect
        - playNotificationSound
        - videoQuality
        - hardwareAcceleration
        - lowLatencyMode
        - bufferDurationMs
        - rtspTransport
        - maxLatencyMs
        - motionSensitivity
        - minimumChangePercent
        - analysisFrameRate
        - analysisWidth
        - analysisHeight
        - postMotionDurationSeconds
        - cooldownSeconds
        - boundingBoxShowInGrid
        - boundingBoxShowInFullScreen
        - boundingBoxColor
        - boundingBoxThickness
        - boundingBoxMinArea
        - boundingBoxPadding
        - boundingBoxSmoothing
        - recordingPath
        - recordingFormat
        - recordAsH264
        - enableRecordingOnMotion
        - enableRecordingOnConnect
        - enableHourlySegmentation
        - maxRecordingDurationMinutes
        - thumbnailTileCount
        - useDailySubfolders
        - separateThumbnailFolder
        - enableTimelapse
        - timelapseInterval
        - cleanupSchedule
        - recordingRetentionDays
        - cleanupIncludeSnapshots
        - snapshotRetentionDays
        - enableDiskSpaceGuard
        - minFreeSpaceMb
        - playbackShowFilename
        - playbackFilenameColor
        - playbackShowTimestamp
        - playbackTimestampColor
        - enableDebugLogging
        - logPath
      properties:
        # General
        themeBase:
          $ref: "#/components/schemas/AppSettingsThemeBase"
        themeAccent:
          type: string
        language:
          type: string
          deprecated: true
          description: Not used by the clients any more; each client keeps its own language. Kept so an older client is not refused.
        connectOnStartup:
          type: boolean
        startMaximized:
          type: boolean
        # Camera Display
        showOverlayTitle:
          type: boolean
        showOverlayDescription:
          type: boolean
        showOverlayTime:
          type: boolean
        showOverlayConnectionStatus:
          type: boolean
        showOverlayQuickActions:
          type: boolean
          description: Show the quick-action buttons on a camera tile. On by default.
        showOverlayConnectionTypeIcon:
          type: boolean
          description: Show the connection-type icon (LAN / Wi-Fi / USB) in a free tile corner.
        connectionTypeIconPlacement:
          $ref: "#/components/schemas/AppSettingsConnectionTypeIconPlacement"
          description: Which corner adjacent to the overlay info box holds the connection-type icon.
        overlayOpacity:
          type: number
          format: double
          minimum: 0
          maximum: 1
        overlayPosition:
          $ref: "#/components/schemas/AppSettingsOverlayPosition"
        allowDragAndDropReorder:
          type: boolean
        autoSaveLayoutChanges:
          type: boolean
        snapshotPath:
          type: string
        # Connection
        defaultProtocol:
          $ref: "#/components/schemas/AppSettingsDefaultProtocol"
        defaultPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        connectionTimeoutSeconds:
          type: integer
          format: int32
          minimum: 1
        reconnectDelaySeconds:
          type: integer
          format: int32
          minimum: 1
        autoReconnectOnFailure:
          type: boolean
        showNotificationOnDisconnect:
          type: boolean
        showNotificationOnReconnect:
          type: boolean
        playNotificationSound:
          type: boolean
        # Performance
        videoQuality:
          type: string
          description: "The highest resolution to decode at: Auto (the camera's own), 1080p, 720p, 480p or 360p. The older names low, medium, high and ultra are still accepted."
        hardwareAcceleration:
          type: boolean
        lowLatencyMode:
          type: boolean
        bufferDurationMs:
          type: integer
          format: int32
          minimum: 1
        rtspTransport:
          $ref: "#/components/schemas/AppSettingsRtspTransport"
        maxLatencyMs:
          type: integer
          format: int32
          minimum: 1
        # Motion Detection
        motionSensitivity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        minimumChangePercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        analysisFrameRate:
          type: integer
          format: int32
          minimum: 1
        analysisWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        analysisHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        postMotionDurationSeconds:
          type: integer
          format: int32
          minimum: 1
        cooldownSeconds:
          type: integer
          format: int32
          minimum: 1
        boundingBoxShowInGrid:
          type: boolean
        boundingBoxShowInFullScreen:
          type: boolean
        boundingBoxColor:
          type: string
        boundingBoxThickness:
          type: integer
          format: int32
          minimum: 1
        boundingBoxMinArea:
          type: integer
          format: int32
          minimum: 1
        boundingBoxPadding:
          type: integer
          format: int32
          minimum: 0
        boundingBoxSmoothing:
          type: number
          format: double
          minimum: 0
          maximum: 1
        # Recording
        recordingPath:
          type: string
        recordingFormat:
          $ref: "#/components/schemas/AppSettingsRecordingFormat"
        recordAsH264:
          type: boolean
          description: Record every camera as H.264 whatever it sends. A camera that sends anything else (H.265, MJPEG) is then decoded and encoded again while it is recorded, which costs processor time. Takes effect the next time a camera is opened.
        enableRecordingOnMotion:
          type: boolean
        enableRecordingOnConnect:
          type: boolean
        enableHourlySegmentation:
          type: boolean
        maxRecordingDurationMinutes:
          type: integer
          format: int32
          minimum: 1
        thumbnailTileCount:
          type: integer
          format: int32
          minimum: 1
        useDailySubfolders:
          type: boolean
          description: Put each day's recordings in their own yyyy-MM-dd folder below the camera folder. On by default. Changing it moves the existing recordings.
        separateThumbnailFolder:
          type: boolean
          description: Keep thumbnails in a thumbnails folder below the recording path instead of next to the videos. On by default. Changing it moves the existing thumbnails.
        enableTimelapse:
          type: boolean
        timelapseInterval:
          type: string
        cleanupSchedule:
          $ref: "#/components/schemas/AppSettingsCleanupSchedule"
        recordingRetentionDays:
          type: integer
          format: int32
          minimum: 1
        cleanupIncludeSnapshots:
          type: boolean
        snapshotRetentionDays:
          type: integer
          format: int32
          minimum: 1
        enableDiskSpaceGuard:
          type: boolean
          description: Delete the oldest recordings when free disk space drops below minFreeSpaceMb.
        minFreeSpaceMb:
          type: integer
          format: int32
          description: Free disk space, in megabytes, the disk space guard keeps available.
        playbackShowFilename:
          type: boolean
        playbackFilenameColor:
          type: string
        playbackShowTimestamp:
          type: boolean
        playbackTimestampColor:
          type: string
        # Advanced
